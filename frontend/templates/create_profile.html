{% extends "base.html" %}
{% block title %}Complete Your Profile | TechTrend{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 1.5rem; max-width: 640px;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-brand); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); color: var(--color-brand); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1rem;">
        <i class="bi bi-person-lines-fill"></i>
      </div>
      <h2 style="font-size: 1.8rem; font-weight: 800;">Create Your Account Profile</h2>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.3rem;">
        Please fill in your primary contact and delivery details to complete registration
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.create_profile_page') }}">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
        <div style="grid-column: span 2;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            FULL NAME *
          </label>
          <input type="text" name="full_name" class="search-input" placeholder="e.g. Rahul Sharma" value="{{ user.get('full_name') or '' }}" required>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            PHONE NUMBER
          </label>
          <input type="text" name="phone" class="search-input" placeholder="e.g. +91 9876543210" value="{{ user.get('phone') or '' }}">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            EMAIL ADDRESS
          </label>
          <input type="email" name="email" class="search-input" placeholder="e.g. rahul@gmail.com" value="{{ user.get('email') or '' }}">
        </div>

        <div style="grid-column: span 2;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            STREET ADDRESS / HOUSE NO. *
          </label>
          <textarea name="address" class="search-input" style="height: 80px; border-radius: var(--radius-md); resize: vertical;" placeholder="Flat 402, Sunshine Apartments, MG Road" required></textarea>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            CITY *
          </label>
          <input type="text" name="city" class="search-input" placeholder="Bengaluru" required>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            STATE *
          </label>
          <input type="text" name="state" class="search-input" placeholder="Karnataka" required>
        </div>

        <div style="grid-column: span 2;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted);">
            PINCODE / POSTAL CODE *
          </label>
          <input type="text" name="pincode" class="search-input" placeholder="560001" maxlength="10" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">
        <i class="bi bi-save-fill"></i> Save Profile & Explore Store
      </button>
    </form>
  </div>
</div>
{% endblock %}
