<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | TechTrend Store</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #070a12;">

  <div style="width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-brand); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); color: var(--color-brand); display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">Admin Control Portal</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.3rem;">Authorized store administrator login</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="toast toast-{{ 'error' if category == 'error' else category }}" style="position: static; margin-bottom: 1.25rem; animation: none; width: 100%;">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.admin_login') }}">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.4rem;">ADMIN EMAIL</label>
        <input type="email" name="email" class="search-input" placeholder="admin@techtrend.com" value="admin@techtrend.com" required>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.4rem;">PASSWORD</label>
        <input type="password" name="password" class="search-input" placeholder="••••••••" value="admin123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="bi bi-box-arrow-in-right"></i> Authenticate & Enter Portal
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-dim); background: var(--bg-input); padding: 0.75rem; border-radius: var(--radius-sm);">
      Default Admin Credentials:<br>
      <strong style="color: var(--color-accent);">admin@techtrend.com</strong> / <strong style="color: var(--color-accent);">admin123</strong>
    </div>

  </div>

</body>
</html>
