{% extends "base.html" %}
{% block title %}500 - Server Error | TechTrend{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center;">
  <div style="width: 90px; height: 90px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); color: var(--color-danger); display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 1.5rem;">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </div>
  <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">500 - Internal Server Error</h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem; max-width: 480px; margin-left: auto; margin-right: auto;">
    Something unexpected happened on our server. Our team has been notified.
  </p>
  <a href="{{ url_for('product.home_page') }}" class="btn btn-primary">
    <i class="bi bi-house-door-fill"></i> Return to Homepage
  </a>
</div>
{% endblock %}
