{% extends "base.html" %}
{% block title %}Sign In / Register | TechTrend{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; display: flex; justify-content: center; align-items: center;">
  <div style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-brand); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <!-- Step 1: Request OTP Form -->
    <div id="stepRequestOtp">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); color: var(--color-brand); display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1rem;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 800;">Welcome to TechTrend</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem;">Sign in or create account using your Phone Number or Email</p>
      </div>

      <form id="formSendOtp" onsubmit="event.preventDefault(); handleSendOtp();">
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-muted);">
            PHONE NUMBER OR EMAIL ADDRESS
          </label>
          <div style="position: relative;">
            <i class="bi bi-person" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
            <input type="text" id="inputIdentifier" class="search-input" style="padding-left: 2.6rem;" placeholder="e.g. +91 9876543210 or user@gmail.com" required>
          </div>
        </div>

        <button type="submit" id="btnSendOtp" class="btn btn-primary btn-full">
          <span>Send 6-Digit OTP</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Step 2: Verify OTP Form -->
    <div id="stepVerifyOtp" style="display: none;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(6, 182, 212, 0.15); color: var(--color-accent); display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1rem;">
          <i class="bi bi-key-fill"></i>
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 800;">Enter 6-Digit OTP</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.3rem;">
          We sent a verification code to <br><strong id="dispIdentifier" style="color: var(--color-accent);"></strong>
        </p>
      </div>

      <form id="formVerifyOtp" onsubmit="event.preventDefault(); handleVerifyOtp();">
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-muted); text-align: center;">
            VERIFICATION CODE
          </label>
          <input type="text" id="inputOtp" class="search-input" style="text-align: center; font-size: 1.6rem; letter-spacing: 0.5rem; font-weight: 800; padding: 0.75rem;" maxlength="6" placeholder="000000" required autocomplete="off">
        </div>

        <button type="submit" id="btnVerifyOtp" class="btn btn-primary btn-full" style="margin-bottom: 1rem;">
          <i class="bi bi-check-circle-fill"></i> Verify & Proceed
        </button>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-dim);">
          <button type="button" class="btn btn-outline btn-sm" onclick="showStep1()" style="padding: 0.3rem 0.6rem;">
            <i class="bi bi-pencil-square"></i> Change
          </button>
          
          <button type="button" id="btnResendOtp" class="btn btn-outline btn-sm" onclick="handleSendOtp()" disabled>
            Resend OTP (<span id="timerCountdown">30</span>s)
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentIdentifier = '';
let resendTimer = null;
let secondsLeft = 30;

function showStep1() {
  document.getElementById('stepRequestOtp').style.display = 'block';
  document.getElementById('stepVerifyOtp').style.display = 'none';
  clearInterval(resendTimer);
}

async function handleSendOtp() {
  const input = document.getElementById('inputIdentifier').value.trim();
  if (!input) {
    TechTrend.showToast('Please enter a valid phone number or email.', 'error');
    return;
  }
  
  currentIdentifier = input;
  const btn = document.getElementById('btnSendOtp');
  btn.disabled = true;
  btn.innerText = 'Sending...';

  try {
    const res = await fetch('/api/auth/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: currentIdentifier })
    });
    const data = await res.json();
    btn.disabled = false;
    btn.innerHTML = '<span>Send 6-Digit OTP</span> <i class="bi bi-arrow-right"></i>';

    if (data.success) {
      TechTrend.showToast(data.message, 'success');
      document.getElementById('dispIdentifier').innerText = currentIdentifier;
      document.getElementById('stepRequestOtp').style.display = 'none';
      document.getElementById('stepVerifyOtp').style.display = 'block';
      startResendCountdown();
    } else {
      TechTrend.showToast(data.message, 'error');
    }
  } catch (err) {
    btn.disabled = false;
    TechTrend.showToast('Failed to request OTP.', 'error');
  }
}

function startResendCountdown() {
  clearInterval(resendTimer);
  secondsLeft = 30;
  const resendBtn = document.getElementById('btnResendOtp');
  const timerSpan = document.getElementById('timerCountdown');
  resendBtn.disabled = true;
  timerSpan.innerText = secondsLeft;

  resendTimer = setInterval(() => {
    secondsLeft--;
    timerSpan.innerText = secondsLeft;
    if (secondsLeft <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.innerText = 'Resend OTP';
    }
  }, 1000);
}

async function handleVerifyOtp() {
  const otp = document.getElementById('inputOtp').value.trim();
  if (otp.length !== 6) {
    TechTrend.showToast('Please enter 6-digit OTP code.', 'warning');
    return;
  }

  const btn = document.getElementById('btnVerifyOtp');
  btn.disabled = true;
  btn.innerText = 'Verifying...';

  try {
    const res = await fetch('/api/auth/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: currentIdentifier, otp: otp })
    });
    const data = await res.json();
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Verify & Proceed';

    if (data.success) {
      TechTrend.showToast(data.message, 'success');
      setTimeout(() => window.location.href = data.redirect_url, 800);
    } else {
      TechTrend.showToast(data.message, 'error');
    }
  } catch (err) {
    btn.disabled = false;
    TechTrend.showToast('Verification request failed.', 'error');
  }
}
</script>
{% endblock %}
