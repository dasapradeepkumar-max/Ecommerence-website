{% extends "base.html" %}
{% block title %}404 - Page Not Found | TechTrend{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center;">
  <div style="width: 90px; height: 90px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); color: var(--color-brand); display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 1.5rem;">
    <i class="bi bi-compass"></i>
  </div>
  <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem; max-width: 480px; margin-left: auto; margin-right: auto;">
    The requested page or product could not be located. It might have been moved or removed.
  </p>
  <a href="{{ url_for('product.home_page') }}" class="btn btn-primary">
    <i class="bi bi-house-door-fill"></i> Return to Homepage
  </a>
</div>
{% endblock %}
